name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # ruff and mypy are pinned: both promote new checks in minor releases,
      # which silently turns a green build red. Bump them deliberately.
      - name: Install dependencies
        run: |
          pip install ruff==0.16.4 mypy==2.3.1 pip-audit homeassistant

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: |
          mypy custom_components/ \
            --ignore-missing-imports \
            --exclude custom_components/dreame_mower/dreame/

      - name: pip-audit
        run: |
          python -c "
          import json
          reqs = json.load(open('custom_components/dreame_mower/manifest.json'))['requirements']
          open('_reqs_tmp.txt', 'w').write('\n'.join(reqs))
          "
          pip-audit -r _reqs_tmp.txt
          rm _reqs_tmp.txt
